// Compose compiler stability configuration.
//
// The `shared` module is plain KMP — it has no Compose compiler plugin — so the domain models it
// exposes are inferred unstable, and every composable taking one (RestaurantCard above all) is
// non-skippable. That means a single recomposition of a list re-runs every visible card in full.
//
// These are immutable `data class`es of `val`s. Their `List` fields are never mutated after
// construction; the repositories rebuild the list instead. Treating them as stable is accurate,
// and it is what lets the restaurant list skip untouched items while scrolling.
com.amitshilo.menudeldia.domain.model.*

// Read-only collections held by those models. `List` is an interface, so the compiler cannot know
// the runtime instance is immutable — here it always is.
kotlin.collections.List
